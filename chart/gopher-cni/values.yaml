# Default values for gopher-cni

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

logLevel: info
logFormat: json

# Service account shared by installer DaemonSet, manager Deployment, and proxy pods
serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

# Installer DaemonSet — runs on every node as root to install the CNI plugin
installer:
  image:
    repository: ghcr.io/bartlettc22/gopher-cni-installer
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: ""

  # Application config — maps directly to installer environment variables
  config:
    # Directory in the container where the host root is mounted
    mountedHostDir: /host
    # Host path for CNI network config files
    cniNetDir: /etc/cni/net.d
    # Host path for CNI plugin binaries
    cniBinTargetDir: /opt/cni/bin
    # Host path for the UDS log socket directory
    udsSocketDir: /var/run/gopher-cni

  podAnnotations: {}
  podLabels: {}

  # Pod security context
  podSecurityContext: {}

  # Container security context — must run as root to write to host CNI directories
  securityContext: {}

  resources: {}

  # Node selector — by default run on all nodes
  nodeSelector: {}

  # Tolerations — by default, run on all nodes including control plane
  tolerations:
  - operator: Exists
    effect: NoSchedule

  affinity: {}

# Sidecar image — injected into user pods for init-validation and write-coredns-config.
sidecar:
  image:
    repository: ghcr.io/bartlettc22/gopher-cni-sidecar
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: ""

# Manager Deployment — combined admission webhook server + GopherProxy controller.
manager:
  image:
    repository: ghcr.io/bartlettc22/gopher-cni-manager
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: ""

  replicaCount: 1

  leaderElection: false

  # Application config — maps to environment variables and Kubernetes webhook settings
  config:
    webhookPort: 8443

    # CoreDNS sidecar image for split-DNS pods
    coreDNSImage: "docker.io/coredns/coredns:1.13.1"

    # TLS certificate paths (mounted from cert-manager secret)
    tls:
      certPath: "/etc/webhook/certs/tls.crt"
      keyPath: "/etc/webhook/certs/tls.key"

  podAnnotations: {}
  podLabels: {}

  # Pod security context
  podSecurityContext: {}

  # Container security context — does not require host access
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false

  resources: {}
  affinity: {}

# Proxy image — used by the GopherProxy controller when creating proxy pods.
proxy:
  image:
    repository: ghcr.io/bartlettc22/gopher-cni-proxy
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: ""

# Webhook admission settings — referenced by the Webhook(Configuration) resources.
# Kept separate from manager so webhook behaviour can be tuned independently.
webhook:
  # Webhook failure policy (Fail or Ignore)
  config:
    failurePolicy: Fail
    # Webhook timeout in seconds
    timeoutSeconds: 10

  # cert-manager certificate configuration
  certificate:
    enabled: true
    # Certificate duration (90 days)
    duration: 2160h
    # Renew certificate before expiry (15 days)
    renewBefore: 360h
    # Issuer configuration
    issuer:
      # Create self-signed issuer and CA
      create: true
      # Issuer name (if using existing issuer, set create: false)
      name: ""
      # Issuer kind (Issuer or ClusterIssuer)
      kind: Issuer

  # Service configuration (fronts the manager Deployment for webhook traffic)
  service:
    type: ClusterIP
    port: 443
    targetPort: 8443
