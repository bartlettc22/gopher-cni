apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gopher-cni.fullname" . }}
  labels:
    {{- include "gopher-cni.labels" . | nindent 4 }}
rules:
- apiGroups:
    - ""
  resources:
    - pods
    - secrets
    - services
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
- apiGroups:
    - gopher.cni
  resources:
    - gopherproxies
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
- apiGroups:
    - gopher.cni
  resources:
    - gopherproxies/status
  verbs:
    - get
    - update
    - patch
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - create
    - patch
