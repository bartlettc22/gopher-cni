{{- $managerImage := printf "%s:%s" .Values.manager.image.repository (.Values.manager.image.tag | default .Chart.AppVersion) -}}
{{- $sidecarImage := printf "%s:%s" .Values.sidecar.image.repository (.Values.sidecar.image.tag | default .Chart.AppVersion) -}}
{{- $proxyImage := printf "%s:%s" .Values.proxy.image.repository (.Values.proxy.image.tag | default .Chart.AppVersion) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gopher-cni.fullname" . }}-manager
  labels:
    {{- include "gopher-cni.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "gopher-cni.managerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.manager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gopher-cni.managerSelectorLabels" . | nindent 8 }}
        {{- with .Values.manager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gopher-cni.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
      containers:
      - name: gopher-cni-manager
        image: "{{ $managerImage }}"
        imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
        env:
        - name: LOG_LEVEL
          value: {{ .Values.logLevel }}
        - name: LOG_FORMAT
          value: {{ .Values.logFormat }}
        - name: WEBHOOK_SIDECAR_IMAGE
          value: {{ $sidecarImage | quote }}
        - name: WEBHOOK_COREDNS_IMAGE
          value: {{ .Values.manager.config.coreDNSImage | quote }}
        - name: WEBHOOK_PORT
          value: {{ .Values.manager.config.webhookPort | quote }}
        - name: WEBHOOK_TLS_CERT_PATH
          value: {{ .Values.manager.config.tls.certPath }}
        - name: WEBHOOK_TLS_KEY_PATH
          value: {{ .Values.manager.config.tls.keyPath }}
        - name: PROXY_IMAGE
          value: {{ $proxyImage | quote }}
        - name: PROBE_ADDR
          value: ":8081"
        - name: LEADER_ELECTION
          value: {{ .Values.manager.leaderElection | quote }}
        ports:
        - name: webhook
          containerPort: {{ .Values.manager.config.webhookPort }}
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.manager.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: certs
          mountPath: /etc/webhook/certs
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: certs
        secret:
          secretName: {{ include "gopher-cni.certificateSecretName" . }}
          defaultMode: 0640
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
