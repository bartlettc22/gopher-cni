apiVersion: v1
kind: Service
metadata:
  name: {{ include "gopher-cni.webhookServiceName" . }}
  labels:
    {{- include "gopher-cni.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhook.service.type }}
  ports:
  - port: {{ .Values.webhook.service.port }}
    targetPort: {{ .Values.webhook.service.targetPort }}
    protocol: TCP
    name: https
  selector:
    {{- include "gopher-cni.webhookSelectorLabels" . | nindent 4 }}
