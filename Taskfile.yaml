version: '3'

vars:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOLANGCI_LINT_BIN: '{{.ROOT_DIR}}/bin/golangci-lint'
  K3D_VERSION: v5.7.4
  K3D_BIN: '{{.ROOT_DIR}}/bin/k3d'
  CONTROLLER_GEN_VERSION: v0.17.3
  CONTROLLER_GEN_BIN: '{{.ROOT_DIR}}/bin/controller-gen'

tasks:
  _golangci-lint-install:
    internal: true
    run: once
    vars:
      VERSION_NO_V:
        sh: echo "{{.GOLANGCI_LINT_VERSION}}" | sed 's/^v//'
    cmds:
    - |
      if ! "{{.GOLANGCI_LINT_BIN}}" version 2>/dev/null | grep -qF "{{.GOLANGCI_LINT_VERSION}}"; then
        echo "Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
        mkdir -p "{{.ROOT_DIR}}/bin"
        curl -sSfL \
          "https://github.com/golangci/golangci-lint/releases/download/{{.GOLANGCI_LINT_VERSION}}/golangci-lint-{{.VERSION_NO_V}}-{{OS}}-{{ARCH}}.tar.gz" \
          | tar -xz -C "{{.ROOT_DIR}}/bin" --strip-components=1 \
            "golangci-lint-{{.VERSION_NO_V}}-{{OS}}-{{ARCH}}/golangci-lint"
      fi

  _controller-gen-install:
    internal: true
    run: once
    cmds:
    - |
      if ! "{{.CONTROLLER_GEN_BIN}}" --version 2>/dev/null | grep -qF "{{.CONTROLLER_GEN_VERSION}}"; then
        echo "Installing controller-gen {{.CONTROLLER_GEN_VERSION}}..."
        mkdir -p "{{.ROOT_DIR}}/bin"
        GOBIN="{{.ROOT_DIR}}/bin" go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_GEN_VERSION}}
      fi

  go:generate:
    desc: Generate deepcopy methods and CRD manifests from type markers, then sync to Helm chart
    dir: '{{.ROOT_DIR}}'
    deps: [_controller-gen-install]
    cmds:
    - '"{{.CONTROLLER_GEN_BIN}}" object paths="./api/..."'
    - '"{{.CONTROLLER_GEN_BIN}}" crd paths="./api/..." output:crd:dir=config/crd/'
    - 'cp config/crd/*.yaml chart/gopher-cni/crds/'

  go:fmt:
    desc: Format Go source files
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
    - gofmt -w $(find . -name '*.go' -not -path '*/vendor/*')

  go:fmt-check:
    desc: Check Go source file formatting (non-zero exit if unformatted)
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
    - |
      unformatted=$(gofmt -l $(find . -name '*.go' -not -path '*/vendor/*'))
      if [ -n "$unformatted" ]; then
        echo "The following files need formatting (run 'task go:fmt'):"
        echo "$unformatted"
        exit 1
      fi

  go:lint:
    desc: Run golangci-lint
    dir: '{{.USER_WORKING_DIR}}'
    deps: [_golangci-lint-install]
    cmds:
    - '"{{.GOLANGCI_LINT_BIN}}" run --config {{.ROOT_DIR}}/.github/.golangci.yaml --timeout=5m'

  go:test:
    desc: Run unit tests (VERBOSE=1, COVER=1)
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      VERBOSE: '{{default "" .VERBOSE}}'
      COVER: '{{default "" .COVER}}'
      VERBOSE_FLAG:
        sh: '[ -n "{{.VERBOSE}}" ] && echo "-v" || echo ""'
      COVER_FLAGS:
        sh: '[ -n "{{.COVER}}" ] && echo "-coverprofile=coverage.out -covermode=atomic" || echo ""'
    cmds:
    - go test -race -cover {{.VERBOSE_FLAG}} {{.COVER_FLAGS}} ./...

  _k3d-install:
    internal: true
    run: once
    cmds:
    - |
      if ! "{{.K3D_BIN}}" version 2>/dev/null | grep -qF "{{.K3D_VERSION}}"; then
        echo "Installing k3d {{.K3D_VERSION}}..."
        mkdir -p "{{.ROOT_DIR}}/bin"
        curl -sSfL \
          "https://github.com/k3d-io/k3d/releases/download/{{.K3D_VERSION}}/k3d-{{OS}}-{{ARCH}}" \
          -o "{{.K3D_BIN}}"
        chmod +x "{{.K3D_BIN}}"
      fi

  go:test-integration:
    desc: Run integration tests against a k3d cluster (KEEP_CLUSTER=1 to retain after run)
    dir: '{{.ROOT_DIR}}'
    deps: [_k3d-install]
    vars:
      KEEP_CLUSTER: '{{default "0" .KEEP_CLUSTER}}'
    env:
      KEEP_CLUSTER: '{{.KEEP_CLUSTER}}'
    cmds:
    - PATH="{{.ROOT_DIR}}/bin:$PATH" go test -v -count=1 -tags integration -timeout 20m ./tests/integration/...

  go:tidy:
    desc: Tidy and vendor Go modules
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
    - go mod tidy
    - go mod vendor

  docker:build:
    desc: Build Docker image (TARGET, ARCH, REGISTRY, IMAGE, VERSION, PUSH, PLATFORMS)
    dir: '{{.ROOT_DIR}}'
    vars:
      TARGET: '{{default "installer" .TARGET}}'
      ARCH: '{{default "amd64" .ARCH}}'
      REGISTRY: '{{default "ghcr.io/bartlettc22" .REGISTRY}}'
      IMAGE: '{{default (printf "gopher-cni-%s" .TARGET) .IMAGE}}'
      VERSION: '{{default "dev" .VERSION}}'
      PUSH: '{{default "false" .PUSH}}'
      PLATFORMS:
        sh: |
          if [ -n "{{.PLATFORMS}}" ]; then
            echo "{{.PLATFORMS}}"
          else
            case "{{.ARCH}}" in
              arm64|arm) echo "linux/arm64" ;;
              *) echo "linux/amd64" ;;
            esac
          fi
      OUTPUT:
        sh: '[ "{{.PUSH}}" = "true" ] && echo "--push" || echo "--load"'
      TAG: '{{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}'
      INSTALL_QEMU_WITHOUT_PROMPT: '{{default "false" .INSTALL_QEMU_WITHOUT_PROMPT}}'
    cmds:
    - |
      if echo "{{.PLATFORMS}}" | grep -q "arm64"; then
        if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
          if [ "{{.INSTALL_QEMU_WITHOUT_PROMPT}}" != "true" ]; then
            read -r -p "Install arm64 QEMU binfmt handlers (requires --privileged)? [y/N] " confirm
            [ "$confirm" = "y" ] || [ "$confirm" = "Y" ] || { echo "Aborted."; exit 1; }
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64
        fi
      fi
    - |
      docker buildx build \
        --target {{.TARGET}} \
        --platform {{.PLATFORMS}} \
        --build-arg VERSION={{.VERSION}} \
        --tag {{.TAG}} \
        --file build/Dockerfile \
        {{.OUTPUT}} \
        .

  docker:publish:
    desc: Publish multi-arch (amd64/arm64) Docker images (installer + webhook) to registry
    vars:
      REGISTRY: '{{default "ghcr.io/bartlettc22" .REGISTRY}}'
      VERSION: '{{default "dev" .VERSION}}'
      INSTALL_QEMU_WITHOUT_PROMPT: '{{default "false" .INSTALL_QEMU_WITHOUT_PROMPT}}'
    cmds:
    - task: docker:build
      vars:
        REGISTRY: '{{.REGISTRY}}'
        TARGET: installer
        IMAGE: gopher-cni-installer
        VERSION: '{{.VERSION}}'
        PLATFORMS: linux/amd64,linux/arm64
        PUSH: "true"
        INSTALL_QEMU_WITHOUT_PROMPT: '{{.INSTALL_QEMU_WITHOUT_PROMPT}}'
    - task: docker:build
      vars:
        REGISTRY: '{{.REGISTRY}}'
        TARGET: webhook
        IMAGE: gopher-cni-webhook
        VERSION: '{{.VERSION}}'
        PLATFORMS: linux/amd64,linux/arm64
        PUSH: "true"
        INSTALL_QEMU_WITHOUT_PROMPT: '{{.INSTALL_QEMU_WITHOUT_PROMPT}}'
    - task: docker:build
      vars:
        REGISTRY: '{{.REGISTRY}}'
        TARGET: sidecar
        IMAGE: gopher-cni-sidecar
        VERSION: '{{.VERSION}}'
        PLATFORMS: linux/amd64,linux/arm64
        PUSH: "true"
        INSTALL_QEMU_WITHOUT_PROMPT: '{{.INSTALL_QEMU_WITHOUT_PROMPT}}'

  helm:publish:
    desc: Package and push Helm chart to OCI registry
    dir: '{{.ROOT_DIR}}'
    vars:
      REGISTRY: '{{default "ghcr.io/bartlettc22" .REGISTRY}}'
      VERSION: '{{default "0.0.0" .VERSION}}'
      VERSION_NO_V:
        sh: echo "{{.VERSION}}" | sed 's/^v//'
    cmds:
    - helm package chart/gopher-cni --version {{.VERSION_NO_V}} --app-version {{.VERSION}} --destination /tmp
    - helm push /tmp/gopher-cni-{{.VERSION_NO_V}}.tgz oci://{{.REGISTRY}}/charts

  helm:lint:
    desc: Lint the Helm chart
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
    - helm lint chart/gopher-cni