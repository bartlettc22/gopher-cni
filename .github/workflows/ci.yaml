name: CI

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
    - main

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Check formatting
        run: task go:fmt-check

      - name: Run lint
        run: task go:lint

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Lint Helm chart
        run: task helm:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run tests
        run: task go:test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint, helm-lint, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run integration tests
        run: task go:test-integration

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build Docker image
        run: task docker:build ARCH=${{ matrix.arch }} INSTALL_QEMU_WITHOUT_PROMPT=true VERSION=${{ github.ref_name }}-${{ github.sha }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, helm-lint, test, build]
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Publish Docker image
        run: task docker:publish VERSION=${{ github.ref_name }} INSTALL_QEMU_WITHOUT_PROMPT=true

      - name: Publish Helm chart
        run: task helm:publish VERSION=${{ github.ref_name }}